name: GLaDOS Daily Checkin

on:
  push:
    branches: [ main ] 
  schedule:
    - cron: '00 16 * * *'  # 每天16:00 UTC（北京时间00:00）执行
  workflow_dispatch:      

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'
        cache: 'pip'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install requests zstandard

    - name: Create config.py from Secret
      env:
        CONFIG_SECRET: ${{ secrets.CONFIG_PY }}
      run: |
        python -c "import os; open('config.py', 'w', encoding='utf-8').write(os.environ.get('CONFIG_SECRET', ''))"

    # --- 新增的检测步骤 ---
    - name: Check config.py size
      run: |
        echo "检查文件大小："
        ls -lh config.py
        echo "检查文件行数："
        wc -l config.py

    - name: Run Checkin Script
      run: |
        python auto_checkin.py